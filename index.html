function rgb(a) { return `rgb(${a[0]},${a[1]},${a[2]})`; }
function lighten(a, factor=0.85) {
  return `rgb(${Math.round(a[0]+(255-a[0])*factor)},${Math.round(a[1]+(255-a[1])*factor)},${Math.round(a[2]+(255-a[2])*factor)})`;
}

// 한자(漢字)만 궁서체(.hj 클래스, CSS 참고)로 감싸고 나머지는 그대로 두는 헬퍼.
// 한글 설명 속에 한자가 섞여 나오는 경우(예: "이백(李白)")에도 그 한자 글자만
// 궁서체로 표시하기 위해, textContent 대신 innerHTML로 넣을 때 사용한다.
function isHanjaChar(ch) {
  const cp = ch.codePointAt(0);
  // CJK 확장 A(0x3400~0x4DBF) + CJK 통합 한자(0x4E00~0x9FFF)
  return (cp >= 0x3400 && cp <= 0x4dbf) || (cp >= 0x4e00 && cp <= 0x9fff);
}
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function wrapHanja(text) {
  let out = "";
  for (const ch of String(text)) {
    out += isHanjaChar(ch) ? `<span class="hj">${escapeHtml(ch)}</span>` : escapeHtml(ch);
  }
  return out;
}

function toUTCDateOnly(date) {
  return Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
}

// 2026-08-10(월)을 제1주로 하는 커스텀 주차 계산 (Python의 pick_idiom과 동일 로직)
function computeWeek(date) {
  const diffDays = Math.floor((toUTCDateOnly(date) - WEEK1_START.getTime()) / DAY_MS);
  return Math.floor(diffDays / 7) + 1;
}

function weekStartDate(weekNo) {
  return new Date(WEEK1_START.getTime() + (weekNo - 1) * 7 * DAY_MS);
}

function idxForWeek(weekNo) {
  return (((weekNo - 1) % IDIOMS.length) + IDIOMS.length) % IDIOMS.length;
}

// 영문법 Point는 사자성어와 같은 주차 번호(weekNo)를 공유하되, 자기 배열
// 길이(GRAMMAR_POINTS.length)로 독립적으로 순환한다 - 두 개의 서로 다른
// 시계가 같은 주차 번호를 함께 쓰는 구조(generate_weekly_idiom.py의
// pick_grammar_point()와 동일한 로직).
function idxForGrammarWeek(weekNo) {
  return (((weekNo - 1) % GRAMMAR_POINTS.length) + GRAMMAR_POINTS.length) % GRAMMAR_POINTS.length;
}

const TOTAL_WEEKS = Math.max(IDIOMS.length, GRAMMAR_POINTS.length);

function pad(n) { return String(n).padStart(2, "0"); }
function fmtDate(d) {
  return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
}

function populateWeekSelect() {
  const sel = document.getElementById("weekSelect");
  sel.innerHTML = "";
  for (let w = 1; w <= TOTAL_WEEKS; w++) {
    const idiom = IDIOMS[idxForWeek(w)];
    const gp = GRAMMAR_POINTS[idxForGrammarWeek(w)];
    const opt = document.createElement("option");
    opt.value = w;
    opt.textContent = `제${w}주 · ${fmtDate(weekStartDate(w))} · ${idiom.hanja}(${idiom.hangul}) · Point ${pad(gp.point_no)} ${gp.title}`;
    sel.appendChild(opt);
  }
}

// tokens: [[phrase, label|null], ...] - 사자성어 쪽 wrapHanja와 비슷한 역할.
// phrase는 그대로, label이 있으면 뒤에 "(LABEL)"을 LABEL_COLORS 색으로 붙인다.
function buildLabeledSentence(parts) {
  const frag = document.createDocumentFragment();
  parts.forEach(([phrase, label], i) => {
    if (i > 0) frag.appendChild(document.createTextNode(" "));
    frag.appendChild(document.createTextNode(phrase));
    if (label) {
      frag.appendChild(document.createTextNode(" "));
      const ls = document.createElement("span");
      ls.className = "lbl";
      ls.textContent = `(${label})`;
      ls.style.color = rgb(LABEL_COLORS[label] || [120, 120, 120]);
      frag.appendChild(ls);
    }
  });
  frag.appendChild(document.createTextNode("."));
  return frag;
}

function renderGrammar() {
  const gp = GRAMMAR_POINTS[idxForGrammarWeek(currentWeek)];
  const startDate = weekStartDate(currentWeek);
  const dateStr = fmtDate(startDate);

  document.getElementById("gHeaderText").textContent =
    `이번 주의 영어 문법  ·  ${dateStr} 시작  (제${currentWeek}주)`;
  document.getElementById("gChapter").textContent = `${gp.chapter} · ${gp.unit}`;
  document.getElementById("gTitle").textContent = `Point ${pad(gp.point_no)}  ${gp.title}`;

  // 이 페이지에서 새로 등장하는 용어만 한자 풀이(독음+뜻풀이)와 일상 속
  // 한자어 예시를 곁들여 동적으로 보여준다 (generate_weekly_idiom.py의
  // _draw_term_card()와 같은 내용).
  const termCard = document.getElementById("termCard");
  termCard.innerHTML = "";
  (gp.new_terms || []).forEach((t) => {
    const row = document.createElement("div");
    row.className = "term-row";
    const l = document.createElement("span");
    l.className = "term-label";
    l.textContent = t.term;
    const d = document.createElement("span");
    d.className = "term-def";
    d.textContent = t.definition;
    row.appendChild(l);
    row.appendChild(d);

    const sub = document.createElement("div");
    sub.className = "term-sub";
    const hanjaStr = t.hanja.map(([ch, eum]) => `${ch}(${eum})`).join(" ");
    sub.textContent = `${hanjaStr}   ·   일상 속 한자어: ${t.words.join(", ")}`;
    row.appendChild(sub);

    termCard.appendChild(row);
  });

  document.getElementById("gConcept").textContent = gp.concept;

  const krExample = document.getElementById("krExample");
  krExample.innerHTML = "";
  krExample.appendChild(buildLabeledSentence(gp.korean_example));

  const enExample = document.getElementById("enExample");
  enExample.innerHTML = "";
  enExample.appendChild(buildLabeledSentence(gp.english_example));

  document.getElementById("compareNote").textContent = gp.compare_note;

  const principleText = document.getElementById("principleText");
  principleText.innerHTML = "";
  (Array.isArray(gp.principle) ? gp.principle : [gp.principle]).forEach((para) => {
    const p = document.createElement("div");
    p.className = "g-principle-para";
    p.textContent = para;
    principleText.appendChild(p);
  });

  const gExamples = document.getElementById("gExamples");
  gExamples.innerHTML = "";
  gp.examples.forEach((ex, i) => {
    const item = document.createElement("div");
    item.className = "g-example-item";
    item.appendChild(document.createTextNode(`${i + 1}. `));
    item.appendChild(buildLabeledSentence(ex.parts));
    const tr = document.createElement("div");
    tr.className = "translation";
    tr.textContent = ex.translation;
    item.appendChild(tr);
    gExamples.appendChild(item);
  });

  document.getElementById("tipText").textContent = " " + gp.tip;
}

// 개론 페이지 하단 공백에 "묶음 -> 개별 용어" 구조를 한눈에 보여주는 트리
// 도식을 SVG로 그린다. generate_weekly_idiom.py의 _draw_group_tree()와
// 같은 레이아웃(루트 박스 -> 그룹 박스(색상 구분) -> 항목 목록)을 그대로
// 따라간다. groups/items는 본문에서 이미 쓴 overview 객체를 그대로 재사용.
function buildGroupTreeSvg(overview) {
  const CONTAINER_W = 1120; // viewBox 기준 폭(실제 표시는 CSS로 100% 스케일)
  const groups = overview.groups;
  const extra = overview.en_diff_items; // 있으면(현재 품사 개론만) 점선 6번째 가지로 추가
  const nGroups = groups.length;
  const nTotal = nGroups + (extra && extra.length ? 1 : 0);
  const colW = CONTAINER_W / nTotal;
  const colCenters = Array.from({ length: nTotal }, (_, i) => colW * (i + 0.5));

  const rootW = 220, rootH = 46;
  const rootCx = CONTAINER_W / 2;
  const trunkY = rootH + 24;
  const groupTop = trunkY + 20;
  const groupBoxH = 42;
  const itemsStartY = groupTop + groupBoxH + 22;
  const itemLineH = 24;
  const maxItems = Math.max(...groups.map((g) => g.items.length), extra ? extra.length : 0);
  const totalH = itemsStartY + maxItems * itemLineH + 8;

  let svg = `<svg viewBox="0 0 ${CONTAINER_W} ${totalH}" xmlns="http://www.w3.org/2000/svg">`;

  svg += `<rect x="${rootCx - rootW / 2}" y="0" width="${rootW}" height="${rootH}" rx="10" fill="#282828" />`;
  svg += `<text x="${rootCx}" y="${rootH / 2}" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-weight="800" font-size="20">${escapeHtml(overview.diagram_root)}</text>`;

  svg += `<line x1="${rootCx}" y1="${rootH}" x2="${rootCx}" y2="${trunkY}" stroke="#969696" stroke-width="2" />`;
  svg += `<line x1="${colCenters[0]}" y1="${trunkY}" x2="${colCenters[nTotal - 1]}" y2="${trunkY}" stroke="#969696" stroke-width="2" />`;

  groups.forEach((g, i) => {
    const cx = colCenters[i];
    const color = rgb(CHAR_COLORS[i % CHAR_COLORS.length]);
    svg += `<line x1="${cx}" y1="${trunkY}" x2="${cx}" y2="${groupTop}" stroke="#969696" stroke-width="2" />`;
    const boxW = Math.min(colW - 20, 170);
    svg += `<rect x="${cx - boxW / 2}" y="${groupTop}" width="${boxW}" height="${groupBoxH}" rx="9" fill="${color}" />`;
    svg += `<text x="${cx}" y="${groupTop + groupBoxH / 2}" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-weight="700" font-size="17">${escapeHtml(g.group)}</text>`;
    svg += `<line x1="${cx}" y1="${groupTop + groupBoxH}" x2="${cx}" y2="${itemsStartY - 16}" stroke="#c8c8c8" stroke-width="1" />`;
    g.items.forEach((it, j) => {
      const ty = itemsStartY + j * itemLineH;
      svg += `<text x="${cx}" y="${ty}" text-anchor="middle" font-size="15" fill="#323232">${escapeHtml(it.term)}</text>`;
    });
  });

  // 한국어 9품사엔 없는 영어 전용 품사(관사/전치사/관계대명사/조동사) -
  // 점선 테두리로 실선 가지들과 구분되는 "참고용" 여섯 번째 가지.
  if (extra && extra.length) {
    const cx = colCenters[nGroups];
    svg += `<line x1="${cx}" y1="${trunkY}" x2="${cx}" y2="${groupTop}" stroke="#a0a0a0" stroke-width="2" stroke-dasharray="6,4" />`;
    const boxW = Math.min(colW - 20, 170);
    svg += `<rect x="${cx - boxW / 2}" y="${groupTop}" width="${boxW}" height="${groupBoxH}" rx="9" fill="none" stroke="#8c8c8c" stroke-width="2" stroke-dasharray="6,4" />`;
    svg += `<text x="${cx}" y="${groupTop + groupBoxH / 2}" text-anchor="middle" dominant-baseline="central" fill="#6e6e6e" font-weight="700" font-size="15">영어에만 있음</text>`;
    svg += `<line x1="${cx}" y1="${groupTop + groupBoxH}" x2="${cx}" y2="${itemsStartY - 16}" stroke="#c8c8c8" stroke-width="1" stroke-dasharray="4,3" />`;
    extra.forEach((it, j) => {
      const ty = itemsStartY + j * itemLineH;
      svg += `<text x="${cx}" y="${ty}" text-anchor="middle" font-size="15" fill="#6e6e6e">${escapeHtml(it.term)}</text>`;
    });
  }

  svg += `</svg>`;
  return svg;
}

// 개론 2장(품사/문장성분)은 주간 로테이션과 무관하게 항상 같은 내용이므로,
// 매주 다시 그릴 필요 없이 페이지 로드 시 딱 한 번만 렌더링한다
// (generate_weekly_idiom.py의 build_overview_image()와 같은 내용/순서).
function buildOverviewPage(prefix, overview, showRule) {
  document.getElementById(prefix + "Title").textContent = overview.title;

  const introBox = document.getElementById(prefix + "Intro");
  introBox.innerHTML = "";
  const hj = document.createElement("div");
  hj.className = "ov-intro-hanja";
  hj.textContent = overview.intro_hanja.map(([ch, eum]) => `${ch}(${eum})`).join("   ");
  const tx = document.createElement("div");
  tx.className = "ov-intro-text";
  tx.textContent = overview.intro;
  introBox.appendChild(hj);
  introBox.appendChild(tx);

  const groupsEl = document.getElementById(prefix + "Groups");
  groupsEl.innerHTML = "";
  overview.groups.forEach((g, gi) => {
    const color = rgb(CHAR_COLORS[gi % CHAR_COLORS.length]);
    const groupDiv = document.createElement("div");
    groupDiv.className = "ov-group";

    const header = document.createElement("div");
    const hjStr = g.hanja.map(([ch, eum]) => `${ch}(${eum})`).join(" ");
    const nameSpan = document.createElement("span");
    nameSpan.className = "ov-group-name";
    nameSpan.style.color = color;
    nameSpan.textContent = `${g.group}  [${hjStr}]`;
    const defSpan = document.createElement("span");
    defSpan.className = "ov-group-def";
    defSpan.textContent = g.definition;
    header.appendChild(nameSpan);
    header.appendChild(defSpan);
    groupDiv.appendChild(header);

    const words = document.createElement("div");
    words.className = "ov-group-words";
    words.textContent = "일상 속 한자어: " + g.words.join(", ");
    groupDiv.appendChild(words);

    g.items.forEach((it) => {
      const line = document.createElement("div");
      line.className = "ov-item";
      const ihj = it.hanja.map(([ch, eum]) => `${ch}(${eum})`).join(" ");
      const ex = it.example ? `   예) ${it.example}` : "";
      line.textContent = `·  ${it.term}  [${ihj}]  —  ${it.definition}${ex}`;
      groupDiv.appendChild(line);
    });

    groupsEl.appendChild(groupDiv);
  });

  const ruleBox = document.getElementById(prefix + "Rule");
  if (ruleBox) {
    if (showRule && overview.rule_note) {
      ruleBox.style.display = "";
      ruleBox.innerHTML = "";
      const label = document.createElement("span");
      label.className = "ov-rule-label";
      label.textContent = "구별법";
      const text = document.createElement("span");
      text.textContent = overview.rule_note;
      ruleBox.appendChild(label);
      ruleBox.appendChild(text);
    } else {
      ruleBox.style.display = "none";
    }
  }

  // "영어와 이렇게 달라요" 비교 박스 (현재는 품사 개론에만 있음).
  const diffLabel = document.getElementById(prefix + "DiffLabel");
  const diffBox = document.getElementById(prefix + "Diff");
  if (diffBox) {
    if (overview.en_diff_items && overview.en_diff_items.length) {
      diffLabel.style.display = "";
      diffBox.style.display = "";
      diffBox.innerHTML = "";
      const intro = document.createElement("div");
      intro.className = "ov-diff-intro";
      intro.textContent = overview.en_diff_intro;
      diffBox.appendChild(intro);
      overview.en_diff_items.forEach((it) => {
        const row = document.createElement("div");
        row.className = "ov-diff-item";
        const headerLine = document.createElement("div");
        const termSpan = document.createElement("span");
        termSpan.className = "diff-term";
        termSpan.textContent = `${it.term} (${it.en_term})`;
        const exSpan = document.createElement("span");
        exSpan.className = "diff-examples";
        exSpan.textContent = "   " + it.examples;
        headerLine.appendChild(termSpan);
        headerLine.appendChild(exSpan);
        const noteLine = document.createElement("div");
        noteLine.className = "diff-note";
        noteLine.textContent = it.note;
        const eqLine = document.createElement("div");
        eqLine.className = "diff-eq";
        eqLine.textContent = "→ " + it.korean_equivalent;
        row.appendChild(headerLine);
        row.appendChild(noteLine);
        row.appendChild(eqLine);
        diffBox.appendChild(row);
      });
    } else {
      diffLabel.style.display = "none";
      diffBox.style.display = "none";
    }
  }

  const diagramEl = document.getElementById(prefix + "Diagram");
  if (diagramEl) {
    diagramEl.innerHTML = buildGroupTreeSvg(overview);
  }
}

function renderOverview() {
  const note = "(한 번 읽고 철해 두면 언제든 다시 볼 수 있어요)";
  document.getElementById("ov1HeaderText").textContent = `학습지 개론 · 1장 품사  ${note}`;
  document.getElementById("ov2HeaderText").textContent = `학습지 개론 · 2장 문장성분  ${note}`;
  buildOverviewPage("ov1", POS_OVERVIEW, false);
  buildOverviewPage("ov2", COMPONENT_OVERVIEW, true);
}

// 개론1(품사)/개론2(문장성분)/사자성어/영문법, 이 순서로 체크된 것만 화면·인쇄에
// 보여준다. 여러 조합이 동시에 가능해졌으므로(예: 개론만, 개론+주간 둘 다 등),
// "보이는 페이지 중 맨 처음"만 빼고 나머지에 pb-before(새 장에서 시작)를 붙이는
// 방식으로 일반화했다 - #page2에만 고정으로 걸려 있던 예전 방식과 달리 어떤
// 조합이 와도 항상 올바르게 페이지가 나뉜다.
function applyContentVisibility() {
  const sections = [
    { id: "pageOv1", show: document.getElementById("showPosOvChk").checked },
    { id: "pageOv2", show: document.getElementById("showCompOvChk").checked },
    { id: "page", show: document.getElementById("showIdiomChk").checked },
    { id: "page2", show: document.getElementById("showGrammarChk").checked },
  ];
  let seenVisible = false;
  sections.forEach(({ id, show }) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.style.display = show ? "" : "none";
    el.classList.toggle("pb-before", show && seenVisible);
    if (show) seenVisible = true;
  });
}

function renderAll() {
  render();
  renderGrammar();
}

function render() {
  const idiom = IDIOMS[idxForWeek(currentWeek)];
  const startDate = weekStartDate(currentWeek);
  const dateStr = fmtDate(startDate);

  document.getElementById("info").textContent =
    `${idiom.hanja} (${idiom.hangul}) · 제${currentWeek}주`;

  document.getElementById("headerText").textContent =
    `이번 주의 사자성어  ·  ${dateStr} 시작  (제${currentWeek}주)`;

  const hanjaRow = document.getElementById("hanjaRow");
  hanjaRow.innerHTML = "";
  [...idiom.hanja].forEach((ch, i) => {
    const span = document.createElement("span");
    span.textContent = ch;
    span.style.color = rgb(CHAR_COLORS[i % CHAR_COLORS.length]);
    hanjaRow.appendChild(span);
  });

  document.getElementById("hangulReading").textContent = idiom.hangul;

  const charsRow = document.getElementById("charsRow");
  charsRow.innerHTML = "";
  idiom.chars.forEach((pair, i) => {
    const color = CHAR_COLORS[i % CHAR_COLORS.length];
    const item = document.createElement("span");
    item.className = "char-item";
    item.style.color = rgb(color);
    item.innerHTML = wrapHanja(`${pair[0]}(${pair[1]})`);
    charsRow.appendChild(item);
  });

  document.getElementById("meaningText").textContent = idiom.meaning;
  document.getElementById("originBox").innerHTML = wrapHanja(idiom.origin);

  const exampleList = document.getElementById("exampleList");
  exampleList.innerHTML = "";
  (idiom.examples || []).forEach(sentence => {
    const li = document.createElement("li");
    li.innerHTML = wrapHanja(sentence);
    exampleList.appendChild(li);
  });

  const relatedList = document.getElementById("relatedList");
  relatedList.innerHTML = "";
  const related = RELATED_IDIOMS[idiom.hanja] || { similar: [], opposite: [], opposite_note: "" };

  function buildRelatedItem(item, color, withNuance) {
    const div = document.createElement("div");
    div.className = "related-item";
    const head = document.createElement("div");
    head.className = "head";
    const hanjaSpan = document.createElement("span");
    hanjaSpan.className = "hanja";
    hanjaSpan.textContent = item.hanja;
    hanjaSpan.style.color = rgb(color);
    head.appendChild(hanjaSpan);
    head.appendChild(document.createTextNode(` (${item.hangul}) - ${item.meaning}`));
    div.appendChild(head);
    const breakdown = relatedCharBreakdown(item.hanja, item.hangul);
    if (breakdown) {
      const breakdownDiv = document.createElement("div");
      breakdownDiv.className = "breakdown";
      breakdownDiv.innerHTML = wrapHanja(breakdown);
      div.appendChild(breakdownDiv);
    }
    if (withNuance && item.nuance) {
      const nuance = document.createElement("div");
      nuance.className = "nuance";
      nuance.innerHTML = wrapHanja(item.nuance);
      div.appendChild(nuance);
    }
    return div;
  }

  const simGroup = document.createElement("div");
  simGroup.className = "related-group";
  related.similar.slice(0, 1).forEach((item, i) => {
    simGroup.appendChild(buildRelatedItem(item, CHAR_COLORS[i % CHAR_COLORS.length], true));
  });
  relatedList.appendChild(simGroup);

  const charoriginList = document.getElementById("charoriginList");
  charoriginList.innerHTML = "";
  idiom.chars.forEach((pair, i) => {
    const color = CHAR_COLORS[i % CHAR_COLORS.length];
    const item = document.createElement("div");
    item.className = "charorigin-item";

    const sub = document.createElement("div");
    sub.className = "sub";
    sub.innerHTML = wrapHanja(`${i + 1}. ${pair[0]} (${pair[1]})`);
    sub.style.color = rgb(color);
    item.appendChild(sub);

    // --- 구성요소 시각화: 부수 조합(형성/회의문자) 또는 그림문자 강조(상형/지사문자) ---
    const visual = document.createElement("div");
    visual.className = "visual";
    const components = CHAR_COMPONENTS[pair[0]] || [];
    if (components.length > 0) {
      components.forEach((comp, j) => {
        const compColor = CHAR_COLORS[j % CHAR_COLORS.length];
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = comp;
        chip.style.color = rgb(compColor);
        chip.style.borderColor = rgb(compColor);
        chip.style.background = lighten(compColor, 0.85);
        visual.appendChild(chip);
        if (j < components.length - 1) {
          const plus = document.createElement("span");
          plus.className = "op";
          plus.textContent = "+";
          visual.appendChild(plus);
        }
      });
      const arrow = document.createElement("span");
      arrow.className = "op";
      arrow.textContent = "→";
      visual.appendChild(arrow);
      const resultChip = document.createElement("span");
      resultChip.className = "chip";
      resultChip.textContent = pair[0];
      resultChip.style.color = rgb(color);
      resultChip.style.borderColor = rgb(color);
      resultChip.style.background = lighten(color, 0.85);
      visual.appendChild(resultChip);
    } else {
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = pair[0];
      badge.style.color = rgb(color);
      badge.style.borderColor = rgb(color);
      badge.style.background = lighten(color, 0.85);
      visual.appendChild(badge);
      const note = document.createElement("span");
      note.className = "note";
      note.textContent = "그림에서 그대로 나온 글자예요";
      visual.appendChild(note);
    }
    item.appendChild(visual);

    // 한자 설명 + "이 한자가 쓰이는 일상 단어 예시"를 줄바꿈 없이 같은
    // 문단으로 이어 붙인다(따로 줄을 떼면 마지막 줄의 남는 공간을 못 써서
    // 인쇄 시 종이를 더 차지한다).
    const body = document.createElement("div");
    body.className = "body";
    const originText = CHAR_ORIGINS[pair[0]] || "";
    const wordEntries = CHAR_WORDS[pair[0]];
    const wordText = (wordEntries && wordEntries.length > 0)
      ? "예) " + wordEntries.map(([w, m]) => `${w}(${m})`).join(", ")
      : "";
    // "예) ..." 부분은 짙은 회색 span으로 감싸 한자 설명(검정)과 구분한다.
    const originHtml = wrapHanja(originText);
    const wordHtml = wordText ? `<span class="word-example">${wrapHanja(wordText)}</span>` : "";
    const combinedHtml = (originText && wordText) ? `${originHtml} ${wordHtml}` : (originHtml || wordHtml);
    body.innerHTML = combinedHtml;
    item.appendChild(body);

    charoriginList.appendChild(item);
  });

  // 전체목록 셀렉트 동기화 (범위 밖이면 선택 해제)
  const sel = document.getElementById("weekSelect");
  if (currentWeek >= 1 && currentWeek <= TOTAL_WEEKS) {
    sel.value = String(currentWeek);
  } else {
    sel.selectedIndex = -1;
  }
}

document.getElementById("prevBtn").addEventListener("click", () => {
  currentWeek -= 1;
  renderAll();
});
document.getElementById("nextBtn").addEventListener("click", () => {
  currentWeek += 1;
  renderAll();
});
document.getElementById("thisWeekBtn").addEventListener("click", () => {
  currentWeek = computeWeek(new Date());
  renderAll();
});
document.getElementById("weekSelect").addEventListener("change", (e) => {
  currentWeek = parseInt(e.target.value, 10);
  renderAll();
});
document.getElementById("showIdiomChk").addEventListener("change", applyContentVisibility);
document.getElementById("showGrammarChk").addEventListener("change", applyContentVisibility);
document.getElementById("showPosOvChk").addEventListener("change", applyContentVisibility);
document.getElementById("showCompOvChk").addEventListener("change", applyContentVisibility);


populateWeekSelect();
currentWeek = computeWeek(new Date());
renderAll();
renderOverview();
applyContentVisibility();

// 인쇄가 A4 한 장을 넘기지 않도록, 인쇄 직전에 실제 렌더링 높이를 재서
// 필요한 만큼만 글자를 자동으로 줄인다(Python 버전의 자동 글자 크기 조절과
// 같은 목적 - 성어마다 유래 이야기 길이가 달라 고정 크기로는 항상 맞지 않음).
(function () {
  var A4_TARGET_PX = 1122; // 297mm = 1122px(96dpi) - A4 실제 높이 그대로 사용
  var MIN_FIT = 0.85;      // 너무 작아지지 않도록 최저선을 넉넉히 둠(이전 0.7→0.85)

  // 사자성어(--fit)/영어문법(--fit2) 페이지는 서로 독립적으로 줄어든다 -
  // 체크박스로 한쪽만 인쇄할 때도 그 페이지만 기준으로 딱 맞게 맞추기 위해서다.
  // 개론1/개론2는 같은 변수 이름(--fitOv)을 쓰지만 scope:"self"로 각 페이지
  // 엘리먼트 자신에게 지역 스코프로 설정되므로(: root가 아님) 서로 영향을
  // 주지 않고 독립적으로 줄어든다.
  var PAGES = [
    { id: "pageOv1", cssVar: "--fitOv", scope: "self" },
    { id: "pageOv2", cssVar: "--fitOv", scope: "self" },
    { id: "page", cssVar: "--fit" },
    { id: "page2", cssVar: "--fit2" },
  ];

  function fitTarget(page, scope) {
    return scope === "self" ? page : document.documentElement;
  }

  function setFit(target, cssVar, v) {
    target.style.setProperty(cssVar, String(v));
  }

  function debugShow(text) {
    var el = document.getElementById("fitDebug");
    if (!el) {
      el = document.createElement("div");
      el.id = "fitDebug";
      document.body.appendChild(el);
    }
    el.textContent = text;
  }

  function fitPage(page, cssVar, scope) {
    var target = fitTarget(page, scope);
    setFit(target, cssVar, 1);
    var h0 = page.scrollHeight;
    var fit = 1;
    // 이미 한 페이지 안에 들어가면 손대지 않는다.
    if (h0 <= A4_TARGET_PX) {
      return page.id + ":h=" + h0 + "(변경없음)";
    }
    // 글자 크기를 줄이면 문단 줄바꿈 수도 바뀌므로, 최대 3번만 다시 재며 좁혀간다
    // (너무 여러 번 반복하면 매번 완전히 새로 줄어들며 과도하게 작아질 수 있음).
    var h = h0;
    for (var i = 0; i < 3; i++) {
      if (h <= A4_TARGET_PX || fit <= MIN_FIT) break;
      var ratio = A4_TARGET_PX / h;
      fit = Math.max(fit * ratio, MIN_FIT);
      setFit(target, cssVar, fit.toFixed(3));
      h = page.scrollHeight;
    }
    return page.id + ":h0=" + h0 + " h=" + h + " fit=" + fit.toFixed(3);
  }

  function fitToOnePage() {
    var results = [];
    PAGES.forEach(function (p) {
      var el = document.getElementById(p.id);
      // 체크박스로 꺼서 display:none인 페이지는 scrollHeight가 0이라
      // 의미가 없으므로 건너뛴다.
      if (!el || el.style.display === "none") return;
      results.push(fitPage(el, p.cssVar, p.scope));
    });
    debugShow(results.join(" / "));
  }

  function resetFit() {
    PAGES.forEach(function (p) {
      var el = document.getElementById(p.id);
      if (!el) return;
      setFit(fitTarget(el, p.scope), p.cssVar, 1);
    });
  }

  window.addEventListener("beforeprint", fitToOnePage);
  window.addEventListener("afterprint", resetFit);
})();
</script>
</body>
</html>
