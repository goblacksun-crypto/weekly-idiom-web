<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이번 주의 사자성어</title>
<style>
  :root {
    --magenta: rgb(214,21,148);
    --cyan: rgb(0,150,199);
    --orange: rgb(219,130,10);
    --near-black: rgb(20,20,20);
    --teal: rgb(0,128,90);
    --purple: rgb(110,60,180);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #e9e9e9;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", "NanumGothic", sans-serif;
  }
  .toolbar {
    max-width: 210mm; margin: 12px auto; padding: 0 4mm;
    display: flex; justify-content: space-between; align-items: center;
  }
  .toolbar button {
    font-size: 15px; padding: 8px 18px; border-radius: 8px; border: none;
    background: var(--cyan); color: white; cursor: pointer;
  }
  .toolbar button:hover { opacity: 0.9; }
  .toolbar .info { font-size: 13px; color: #666; }

  #page {
    width: 210mm;
    min-height: 297mm;
    margin: 0 auto 30px auto;
    background: white;
    box-shadow: 0 2px 14px rgba(0,0,0,0.25);
    position: relative;
    overflow: hidden;
    padding-bottom: 16mm;
  }
  .gradient-bar {
    width: 100%; height: 5mm;
    background: linear-gradient(to right, cyan, magenta, yellow);
  }
  .header-row {
    margin: 5mm 10mm 0 10mm;
    display: flex; align-items: center; gap: 10px;
  }
  .header-text {
    font-size: 13px; color: rgb(90,90,90);
  }
  .week-nav {
    display: flex; align-items: center; gap: 4px;
  }
  .week-nav button {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1px solid #bbb;
    background: white;
    color: rgb(20,90,140);
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .week-nav button:hover { background: #eef7fb; }
  .hanja-row {
    margin: 6mm 10mm 0 10mm;
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4mm;
    line-height: 1;
  }
  .hanja-row span {
    font-weight: 800;
    font-size: 20mm;
  }
  .hangul-reading {
    margin: 2mm 10mm 0 10mm;
    font-size: 9mm;
    font-weight: 800;
    color: rgb(20,20,20);
  }
  .chars-row {
    margin: 4mm 10mm 0 10mm;
    display: flex; flex-wrap: wrap; gap: 3mm;
  }
  .char-box {
    padding: 6px 14px;
    border-radius: 8px;
    border-width: 2px;
    border-style: solid;
    font-weight: 700;
    font-size: 13px;
    white-space: nowrap;
  }
  .meaning-bar {
    margin: 5mm 10mm 0 10mm;
    background: rgb(255,244,214);
    border-radius: 8px;
    padding: 10px 16px;
    display: flex; align-items: baseline; gap: 10px;
    font-size: 15px;
  }
  .meaning-bar .label {
    color: rgb(180,110,0); font-weight: 700; font-size: 13px;
  }
  .meaning-bar .text {
    color: rgb(60,40,0); font-weight: 700;
  }
  .origin-label, .example-label, .practice-label {
    margin: 6mm 10mm 0 10mm;
    color: rgb(20,90,140); font-weight: 700; font-size: 15px;
  }
  .origin-box {
    margin: 3mm 10mm 0 10mm;
    background: rgb(235,247,250);
    border: 2px solid rgb(180,220,230);
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 14px;
    line-height: 1.7;
    color: rgb(35,35,35);
  }
  .example-list {
    margin: 3mm 10mm 0 10mm;
    font-size: 14px;
    line-height: 1.8;
    color: rgb(50,50,50);
  }
  .example-list ol {
    margin: 0; padding-left: 20px;
  }
  .practice-grid {
    margin: 3mm 10mm 0 10mm;
  }
  .practice-row {
    display: flex; align-items: stretch; gap: 8px; margin-bottom: 8px;
  }
  .practice-row .label {
    width: 24mm; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px; border-width: 2px; border-style: solid;
    font-weight: 700; font-size: 12px; text-align: center;
  }
  .practice-row .box {
    width: 16mm; height: 16mm; flex-shrink: 0;
    border: 2px solid #bebebe;
    background-image:
      linear-gradient(#e1e1e1 1px, transparent 1px),
      linear-gradient(90deg, #e1e1e1 1px, transparent 1px);
    background-size: 50% 50%;
    background-position: center;
    display: flex; align-items: center; justify-content: center;
    font-size: 12mm; color: rgb(215,215,215); font-weight: 700;
  }
  .footer-text {
    position: absolute; bottom: 8mm; left: 10mm;
    font-size: 11px; color: rgb(140,140,140);
  }

  @media print {
    html, body { background: white; }
    .toolbar { display: none; }
    .week-nav { display: none !important; }
    #page { box-shadow: none; margin: 0 auto; width: auto; min-height: 0; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    @page { size: A4; margin: 0; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <span class="info" id="info">불러오는 중...</span>
  <button onclick="window.print()">인쇄하기</button>
</div>

<div id="page">
  <div class="gradient-bar"></div>
  <div class="header-row">
    <div class="header-text" id="headerText"></div>
    <div class="week-nav">
      <button id="prevBtn" title="지난 주">◀</button>
      <button id="nextBtn" title="다음 주">▶</button>
    </div>
  </div>
  <div class="hanja-row" id="hanjaRow"></div>
  <div class="hangul-reading" id="hangulReading"></div>
  <div class="chars-row" id="charsRow"></div>
  <div class="meaning-bar"><span class="label">뜻</span><span class="text" id="meaningText"></span></div>
  <div class="origin-label">이 말은 어떻게 생겨났을까요?</div>
  <div class="origin-box" id="originBox"></div>
  <div class="example-label">일상생활에서 이렇게 써요</div>
  <div class="example-list"><ol id="exampleList"></ol></div>
  <div class="practice-label">한자 따라 써보아요</div>
  <div class="practice-grid" id="practiceGrid"></div>
  <div class="footer-text">삼성 잉크젯 프린터 잉크 순환용 주간 자동 인쇄 · 노즐 막힘 방지</div>
</div>

<script>
const IDIOMS = [{"hanja":"馬耳東風","hangul":"마이동풍","chars":[["馬","말 마"],["耳","귀 이"],["東","동녘 동"],["風","바람 풍"]],"meaning":"남의 말을 귀담아듣지 않고 흘려버림","origin":"중국 당나라의 시인 이백(李白)이 지은 시 '답왕십이한야독작유회'에 나오는 말이에요. 이백은 아무리 좋은 글을 지어도 세상 사람들이 알아주지 않는 것을 안타까워하며 '세상 사람들이 이 말을 들으면 고개를 흔드니, 마치 동풍이 말의 귀를 스치는 것과 같구나'라고 노래했답니다. 말은 봄바람이 귀를 스쳐도 아무 느낌이 없다는 데서 나온 표현이에요. 그래서 남의 말을 귀담아듣지 않고 그냥 흘려버리는 것을 뜻하게 되었답니다.","examples":["엄마가 방 좀 치우라고 여러 번 말씀하셨지만, 형은 마이동풍으로 흘려들었다.","친구들이 아무리 조언해도 그는 마이동풍처럼 듣는 둥 마는 둥 했다.","선생님의 충고를 마이동풍으로 여기다가 결국 숙제를 또 잊어버렸다."]},{"hanja":"有備無患","hangul":"유비무환","chars":[["有","있을 유"],["備","갖출 비"],["無","없을 무"],["患","근심 환"]],"meaning":"미리 준비가 되어 있으면 근심할 것이 없음","origin":"중국 고전 서경(書經) 열명(說命)편에서 신하 부열이 임금에게 '준비가 있으면 근심이 없다'고 아뢴 데서 나온 말이에요. 춘추시대 진(晉)나라에서는 위강(魏絳)이라는 신하가 화친 정책으로 큰 공을 세우자 도공(悼公)이 상을 내렸는데, 위강은 상을 사양하며 '편안할 때 위태로움을 생각하고, 미리 대비하면 근심이 없다'고 간언했답니다. 이 이야기는 춘추좌씨전(春秋左氏傳)에도 전해져요. 이렇게 미리 준비해 두면 어려운 일이 닥쳐도 걱정할 것이 없다는 뜻을 담게 되었답니다.","examples":["시험 전에 미리 복습해 두는 것이야말로 유비무환이다.","비상약을 챙겨 간 덕분에 여행 중 다쳤을 때 유비무환의 효과를 톡톡히 봤다.","소방 훈련을 자주 하는 것은 유비무환의 마음가짐에서 나온 것이다."]},{"hanja":"一石二鳥","hangul":"일석이조","chars":[["一","한 일"],["石","돌 석"],["二","두 이"],["鳥","새 조"]],"meaning":"한 가지 일로 두 가지 이득을 봄","origin":"사실 '일석이조'는 중국 고전이 아니라 'kill two birds with one stone(돌 하나로 새 두 마리를 잡는다)'이라는 영어 속담을 일본에서 한자로 옮기면서 생긴 말이라고 알려져 있어요. 그 말이 우리나라에 들어와 지금처럼 널리 쓰이게 되었답니다. 비슷한 뜻을 가진 원래의 중국 한자성어로는 '한 번 들어 둘을 얻는다'는 일거양득(一擧兩得)이 있어요. 돌 하나를 던져 새 두 마리를 잡듯, 한 가지 일을 해서 두 가지 이득을 보는 것을 뜻해요.","examples":["자전거로 학교에 가면 운동도 되고 시간도 절약되니 일석이조다.","도서관에서 숙제도 하고 책도 읽으니 일석이조인 셈이다.","봉사활동을 하면서 새 친구도 사귀었으니 일석이조의 경험이었다."]},{"hanja":"轉禍爲福","hangul":"전화위복","chars":[["轉","구를 전"],["禍","재앙 화"],["爲","될 위"],["福","복 복"]],"meaning":"화가 바뀌어 오히려 복이 됨","origin":"중국 전국시대의 유세가 소진(蘇秦)이 한 말에서 비롯되었어요. 소진은 여섯 나라를 돌아다니며 재상을 겸할 만큼 뛰어난 전략가였는데, 전국책(戰國策) 연책(燕策)에서 옛 정치가 관중(管仲)의 업적을 이야기하며 '지혜로운 사람은 화를 바꾸어 복으로 만들고, 실패를 딛고 일어나 공을 이룬다'고 말했답니다. 이 말에서 아무리 나쁜 일이 생겨도 포기하지 않고 노력하면 오히려 좋은 결과로 바꿀 수 있다는 뜻이 생겨났어요.","examples":["다리를 다쳐 쉬는 동안 오히려 책을 많이 읽게 되어 전화위복이 되었다.","시합에서 진 것이 전화위복이 되어 더 열심히 연습하는 계기가 되었다.","전학을 가게 된 것이 처음엔 속상했지만 새 친구를 많이 사귀는 전화위복이 되었다."]},{"hanja":"溫故知新","hangul":"온고지신","chars":[["溫","익힐 온"],["故","옛 고"],["知","알 지"],["新","새 신"]],"meaning":"옛것을 익히고 그것을 미루어 새것을 앎","origin":"공자님의 말씀을 담은 논어(論語) 위정(爲政)편에 나오는 말이에요. 공자는 '옛것을 익히고 그것을 미루어 새것을 알면, 남의 스승이 될 수 있다'라고 말씀하셨답니다. 옛것을 배우는 것이 단순히 과거에 머무는 것이 아니라 새로운 것을 깨닫는 밑거름이 된다는 공자의 가르침이 담겨 있어요.","examples":["옛날 속담을 공부하는 것도 온고지신의 자세라고 할 수 있다.","선생님은 온고지신의 정신으로 전통 놀이를 요즘 방식으로 바꿔 가르쳐 주셨다.","옛 문화재를 배우며 새로운 아이디어를 얻는 것이 바로 온고지신이다."]},{"hanja":"破釜沈舟","hangul":"파부침주","chars":[["破","깨뜨릴 파"],["釜","가마솥 부"],["沈","잠길 침"],["舟","배 주"]],"meaning":"죽을 각오로 싸움에 임함","origin":"중국 진나라 말, 초나라 장수 항우(項羽)가 거록(鉅鹿) 땅에서 진나라 군대와 싸울 때의 일이에요. 항우는 강을 건넌 뒤 타고 온 배를 모두 가라앉히고 밥 짓는 솥까지 깨뜨려 버렸답니다. 병사들에게 사흘 치 식량만 남기고 돌아갈 배도 밥 지을 솥도 없애 버려, 반드시 이기고야 말겠다는 각오를 보여준 것이지요. 이 이야기는 사기(史記) 항우본기(項羽本紀)에 전해지며, 결국 항우의 군대는 목숨을 걸고 싸워 크게 승리했답니다.","examples":["결승전을 앞두고 선수들은 파부침주의 각오로 훈련에 임했다.","그는 이번 시험에 파부침주의 마음으로 모든 걸 걸고 준비했다.","마지막 발표를 앞두고 파부침주의 자세로 밤새 연습했다."]},{"hanja":"塞翁之馬","hangul":"새옹지마","chars":[["塞","변방 새"],["翁","늙은이 옹"],["之","갈 지"],["馬","말 마"]],"meaning":"인생의 길흉화복은 예측하기 어려움","origin":"중국 한나라 때 책 회남자(淮南子) 인간훈(人間訓)에 나오는 이야기예요. 변방에 사는 한 노인의 말이 도망가자 사람들이 위로했지만, 노인은 '이것이 복이 될지 어찌 알겠소'라며 담담했어요. 얼마 뒤 도망갔던 말이 다른 야생마들을 데리고 돌아왔고, 노인의 아들이 그 말을 타다가 떨어져 다리를 다쳤지만, 훗날 전쟁이 나자 다리를 다친 덕분에 징집되지 않고 목숨을 구했답니다. 이렇게 좋은 일과 나쁜 일이 계속 뒤바뀌는 것을 보고, 인생의 길흉화복은 미리 알 수 없다는 뜻이 생겨났어요.","examples":["넘어져서 대회에 못 나간 게 속상했지만, 다음 대회에서 우승했으니 새옹지마다.","버스를 놓친 덕분에 길에서 우연히 옛 친구를 만났으니 새옹지마인 셈이다.","인생은 새옹지마라고, 나쁜 일이 항상 나쁘게만 끝나는 건 아니다."]},{"hanja":"自業自得","hangul":"자업자득","chars":[["自","스스로 자"],["業","업 업"],["自","스스로 자"],["得","얻을 득"]],"meaning":"자기가 저지른 일의 결과를 자기가 받음","origin":"불교 경전에서 나온 말로, 본래 '업(業)'은 자신이 짓는 행동이나 습관을 뜻하는 불교 용어예요. 자기가 지은 선한 업이든 나쁜 업이든 그 결과는 결국 자기 자신에게 돌아온다는 인과응보의 가르침을 담고 있답니다. 그래서 '자업자득'은 자기가 저지른 일의 결과를 자기가 그대로 받는다는 뜻으로 쓰이게 되었어요.","examples":["숙제를 미루다가 밤새 벼락치기를 한 건 자업자득이다.","규칙을 어기고 혼난 건 자업자득이니 누구를 탓할 수 없다.","약속 시간에 늦어 버스를 놓친 것도 자업자득이었다."]},{"hanja":"結者解之","hangul":"결자해지","chars":[["結","맺을 결"],["者","사람 자"],["解","풀 해"],["之","갈 지"]],"meaning":"일을 저지른 사람이 그 일을 끝맺어야 함","origin":"조선 시대 학자 홍만종(洪萬宗)이 지은 순오지(旬五志)라는 책에 나오는 우리나라 한자성어예요. 원문은 '맺은 사람이 그것을 풀어야 하니, 일을 시작한 사람이 마땅히 그 일의 끝을 책임져야 한다'랍니다. 중국 고전이 아니라 우리 조상들이 만들어 쓴 말로, 매듭을 묶은 사람이 풀어야 하듯 어떤 일을 저지른 사람이 그 일을 끝까지 책임지고 해결해야 한다는 지혜를 담고 있어요.","examples":["친구와 다툰 원인을 제공했으니, 결자해지의 마음으로 먼저 사과했다.","자기가 어지른 방은 결자해지의 마음으로 스스로 치웠다.","실수로 생긴 문제니 결자해지하는 게 맞다고 생각해 끝까지 책임졌다."]},{"hanja":"愚公移山","hangul":"우공이산","chars":[["愚","어리석을 우"],["公","공평할 공"],["移","옮길 이"],["山","뫼 산"]],"meaning":"꾸준히 노력하면 큰일도 이룰 수 있음","origin":"중국 고전 열자(列子) 탕문(湯問)편에 나오는 이야기예요. 우공이라는 아흔 살 노인이 집 앞을 가로막은 두 개의 큰 산이 불편해서 산을 옮기기로 했는데, 이웃 사람이 그 나이에 될 리가 없다며 비웃었답니다. 우공은 '내가 못 다 하면 아들이, 아들이 못 다 하면 손자가 계속 옮기다 보면 언젠가는 산이 평평해질 것'이라 답했고, 이 말에 감동한 하늘이 산을 옮겨 주었다는 이야기예요. 이렇게 꾸준히 노력하면 아무리 큰일도 결국 이룰 수 있다는 뜻을 담고 있답니다.","examples":["매일 조금씩 단어를 외우다 보니 우공이산처럼 어느새 단어장을 다 뗐다.","우공이산의 마음으로 꾸준히 연습해서 결국 자전거를 탈 수 있게 되었다.","할아버지는 우공이산의 자세로 몇 년에 걸쳐 마당에 나무를 가득 심으셨다."]},{"hanja":"百聞不如一見","hangul":"백문불여일견","chars":[["百","일백 백"],["聞","들을 문"],["不","아닐 불"],["如","같을 여"],["一","한 일"],["見","볼 견"]],"meaning":"백 번 듣는 것이 한 번 보는 것만 못함","origin":"중국 한나라의 역사책 한서(漢書) 조충국전(趙充國傳)에 나오는 말이에요. 한나라 선제(宣帝) 때 서북 지방의 강족(羌族)이 반란을 일으키자 늙은 장수 조충국에게 대책을 물었는데, 조충국은 '백 번 듣는 것이 한 번 보는 것만 못합니다. 제가 직접 현지에 가서 살펴본 뒤 계책을 올리겠습니다'라고 대답했답니다. 실제로 가서 확인하지 않고는 정확히 알 수 없다는 조충국의 지혜에서 나온 말이에요.","examples":["백문불여일견이라고, 직접 박물관에 가 보니 훨씬 이해가 잘 됐다.","설명만 듣던 화산을 실제로 보니 백문불여일견이라는 말이 실감 났다.","백문불여일견이니 직접 실험해 보고 나서야 원리를 확실히 알게 되었다."]},{"hanja":"燈下不明","hangul":"등하불명","chars":[["燈","등불 등"],["下","아래 하"],["不","아닐 불"],["明","밝을 명"]],"meaning":"가까이 있는 것을 오히려 잘 알지 못함","origin":"'등잔 밑이 어둡다'는 우리나라 속담을 한자로 옮긴 말이에요. 등잔불을 켜면 등잔대의 그림자 때문에 오히려 바로 아래쪽이 어둡게 되는 데서 나온 표현이랍니다. 정확히 어느 문헌에서 처음 나왔는지는 분명하지 않지만, 아주 오래전부터 우리 조상들이 즐겨 쓰던 지혜로운 표현이에요. 가까이 있는 것을 오히려 잘 알아차리지 못하는 상황을 빗대어 쓴답니다.","examples":["안경을 머리에 올려놓고 한참 찾았으니 등하불명이 따로 없다.","열쇠가 가방 안에 있는 줄도 모르고 찾아다녔으니 등하불명이었다.","정작 옆자리 짝꿍이 반장인 줄 몰랐다니 등하불명이 아닐 수 없다."]},{"hanja":"以心傳心","hangul":"이심전심","chars":[["以","써 이"],["心","마음 심"],["傳","전할 전"],["心","마음 심"]],"meaning":"마음과 마음으로 서로 통함","origin":"불교에서 전해지는 염화미소(拈華微笑) 이야기에서 나온 말이에요. 석가모니가 영취산에서 제자들에게 말없이 연꽃 한 송이를 들어 보였는데, 아무도 그 뜻을 몰랐지만 오직 제자 가섭(迦葉)만이 그 뜻을 알아차리고 조용히 미소를 지었답니다. 말 한마디 없이도 스승과 제자의 마음이 서로 통했다는 이 이야기에서, 말을 하지 않아도 마음과 마음으로 뜻이 전해진다는 '이심전심'이라는 말이 생겨났어요.","examples":["단짝 친구와는 말하지 않아도 이심전심으로 통할 때가 많다.","눈빛만 봐도 서로의 마음을 아는 이심전심의 사이가 되었다.","가족끼리는 이심전심으로 서로의 기분을 금방 알아챈다."]},{"hanja":"易地思之","hangul":"역지사지","chars":[["易","바꿀 역"],["地","처지 지"],["思","생각 사"],["之","갈 지"]],"meaning":"처지를 바꾸어서 생각해 봄","origin":"중국 고전 맹자(孟子) 이루(離婁)편에 나오는 말이에요. 맹자는 우(禹)임금과 후직(后稷), 그리고 공자의 제자 안회(顔回)가 각자 처한 상황은 달랐지만 서로 처지를 바꾸어 놓아도 똑같이 행동했을 것이라며 '처지를 바꾸면 다 그러했을 것이다'라고 말했답니다. 처한 상황은 다르지만 마음가짐은 같았다는 이 이야기에서, 상대방의 처지에서 생각해 본다는 뜻의 '역지사지'가 나왔어요.","examples":["동생과 싸울 때는 역지사지의 마음으로 동생 입장도 생각해 보자.","선생님은 역지사지의 자세로 학생들의 마음을 이해하려 하셨다.","친구 처지에서 역지사지로 생각해 보니 왜 화가 났는지 알 것 같았다."]},{"hanja":"苦盡甘來","hangul":"고진감래","chars":[["苦","쓸 고"],["盡","다할 진"],["甘","달 감"],["來","올 래"]],"meaning":"고생 끝에 낙이 옴","origin":"특정한 역사적 인물의 이야기에서 나온 말이라기보다, 예로부터 '쓴 것이 다하면 단 것이 온다'는 뜻으로 널리 쓰여 온 표현이에요. 힘든 고생을 참고 견디다 보면 반드시 좋은 날이 온다는 믿음을 담고 있어, 옛사람들의 편지나 글에서도 자주 등장한답니다. 흥부 이야기처럼 고생 끝에 복을 받는 우리 옛이야기의 정서와도 잘 어울리는 말이에요.","examples":["몇 달간 열심히 연습한 끝에 대회에서 상을 받아 고진감래를 느꼈다.","어려운 수학 문제를 끝까지 풀어냈을 때 고진감래의 기쁨을 맛보았다.","힘든 훈련을 견딘 끝에 완주했으니 고진감래라 할 만하다."]},{"hanja":"刻舟求劍","hangul":"각주구검","chars":[["刻","새길 각"],["舟","배 주"],["求","구할 구"],["劍","칼 검"]],"meaning":"융통성 없이 옛 방식만 고집함","origin":"중국 고전 여씨춘추(呂氏春秋) 찰금(察今)편에 나오는 이야기예요. 초나라의 한 사람이 배를 타고 강을 건너다가 칼을 물에 빠뜨리자, 얼른 뱃전에 칼이 떨어진 자리를 표시해 두었답니다. 배가 강가에 닿자 그는 표시해 둔 자리 밑으로 뛰어들어 칼을 찾았지만, 배는 이미 움직였으니 칼을 찾을 수 없었지요. 이 이야기에서 상황이 변한 것을 모르고 옛 방식만 고집하는 어리석음을 뜻하는 '각주구검'이 나왔어요.","examples":["예전 지도만 믿고 새 길을 무시하다니 각주구검이나 다름없다.","상황이 바뀌었는데도 예전 방법만 고집하는 건 각주구검이다.","스마트폰이 있는데도 옛날 방식만 고집하면 각주구검이 될 수 있다."]},{"hanja":"牛耳讀經","hangul":"우이독경","chars":[["牛","소 우"],["耳","귀 이"],["讀","읽을 독"],["經","경서 경"]],"meaning":"아무리 말해도 알아듣지 못함","origin":"'쇠귀에 경 읽기'라는 우리나라 속담을 한자로 옮긴 말이에요. 소에게 아무리 좋은 경전을 읽어 주어도 소는 그 뜻을 알아듣지 못한다는 데서 나온 표현이랍니다. 중국 고전이 아니라 우리 조상들의 생활 속 지혜에서 생겨난 말로, 아무리 잘 설명해 주어도 알아듣지 못하거나 이해하려 하지 않는 상황을 가리켜요.","examples":["몇 번을 설명해도 못 알아듣는 걸 보니 우이독경이 따로 없다.","아무리 조언해도 듣지 않는 친구에게는 우이독경이라는 말이 딱 맞다.","강아지에게 규칙을 설명해 봐야 우이독경일 뿐이다."]},{"hanja":"畵龍點睛","hangul":"화룡점정","chars":[["畵","그림 화"],["龍","용 룡"],["點","점찍을 점"],["睛","눈동자 정"]],"meaning":"가장 중요한 부분을 마쳐 일을 완성함","origin":"중국 남북조 시대 양(梁)나라의 화가 장승요(張僧繇)의 이야기에서 나왔어요. 그는 금릉의 안락사 벽에 용을 그렸는데 눈동자만은 그리지 않았답니다. 사람들이 이유를 묻자 눈동자를 그리면 용이 날아가 버릴 것이라 했지만 아무도 믿지 않았고, 결국 그가 눈동자를 찍자 천둥번개가 치며 정말로 용이 벽을 뚫고 하늘로 날아올랐다고 해요. 이 이야기는 당나라 때 책 역대명화기(歷代名畵記)에 전해지며, 가장 중요한 부분을 마쳐서 일을 완성한다는 뜻으로 쓰이게 되었어요.","examples":["발표 마지막에 멋진 결론을 덧붙이니 화룡점정이 되었다.","그림에 마지막으로 눈동자를 그려 넣자 화룡점정으로 완성되었다.","케이크 위에 딸기를 올리는 것이 화룡점정이었다."]},{"hanja":"隔世之感","hangul":"격세지감","chars":[["隔","사이뜰 격"],["世","세대 세"],["之","갈 지"],["感","느낄 감"]],"meaning":"많이 달라져서 딴 세상 같은 느낌","origin":"고려 말과 조선 초에 살았던 학자 길재(吉再)가 지은 시조와 함께 자주 이야기되는 말이에요. 길재는 고려의 옛 수도였던 송도(개성)에 다시 찾아가 보니 산천은 그대로인데 함께했던 사람들은 간데없다며, 번성했던 옛 시절이 마치 꿈만 같다고 노래했답니다. 이렇게 세월이 흘러 몰라보게 달라진 모습을 보며 느끼는 감정을 '격세지감'이라 부르게 되었어요. 정확한 최초 출전에는 여러 이야기가 있지만, 짧은 시간에 몰라보게 달라진 세상을 마주했을 때의 놀라움을 표현할 때 두루 쓰인답니다.","examples":["오랜만에 찾은 놀이터가 완전히 바뀌어서 격세지감을 느꼈다.","할머니는 옛날과 달라진 동네를 보며 격세지감이 든다고 하셨다.","몇 년 만에 만난 사촌이 훌쩍 커 있어서 격세지감을 느꼈다."]},{"hanja":"類類相從","hangul":"유유상종","chars":[["類","무리 류"],["類","무리 류"],["相","서로 상"],["從","좇을 종"]],"meaning":"비슷한 무리끼리 서로 사귐","origin":"중국 고전 주역(周易)의 계사전(繫辭傳)에 나오는 '만물은 종류대로 모이고 무리를 지어 나뉜다'는 말에서 비롯되었어요. 비슷한 성질을 가진 것들끼리 서로 모이는 자연의 이치를 표현한 말이랍니다. 이 뜻이 사람에게도 적용되어, 성격이나 생각이 비슷한 사람들끼리 서로 어울리고 사귄다는 의미로 널리 쓰이게 되었어요.","examples":["축구를 좋아하는 친구들끼리 뭉치는 걸 보면 유유상종이라는 말이 맞다.","책을 좋아하는 아이들끼리 독서 모임을 만든 것도 유유상종이다.","유유상종이라고, 성격이 비슷한 친구들끼리 자연스레 친해졌다."]},{"hanja":"靑出於藍","hangul":"청출어람","chars":[["靑","푸를 청"],["出","날 출"],["於","어조사 어"],["藍","쪽 람"]],"meaning":"제자가 스승보다 나음","origin":"본래는 중국 고전 순자(荀子) 권학(勸學)편의 '푸른 물감은 쪽에서 나왔지만 쪽보다 더 푸르다'는 구절에서 비롯된 말이에요. 훗날 남북조 시대 북위(北魏)의 이밀(李謐)이라는 사람의 실제 이야기와 함께 유명해졌는데, 이밀은 어려서 공번(孔璠)이라는 스승에게 배웠지만 학문이 점점 깊어져 결국 스승보다 뛰어나게 되었답니다. 이를 알게 된 공번은 부끄러워하지 않고 오히려 제자였던 이밀에게 배우기를 청했다고 해요. 이 이야기에서 제자가 스승보다 나아지는 것을 뜻하는 '청출어람'이 널리 쓰이게 되었답니다.","examples":["제자가 스승의 요리 실력을 뛰어넘었으니 청출어람이라 할 만하다.","동생이 이제는 형보다 피아노를 더 잘 치니 청출어람이다.","코치보다 뛰어난 실력을 보인 선수를 두고 청출어람이라고 했다."]},{"hanja":"四面楚歌","hangul":"사면초가","chars":[["四","넉 사"],["面","낯 면"],["楚","초나라 초"],["歌","노래 가"]],"meaning":"사방이 모두 적으로 둘러싸인 위태로운 상황","origin":"중국 초나라와 한나라가 다투던 시기, 항우(項羽)가 한나라 유방(劉邦)의 군대에게 해하(垓下)에서 겹겹이 포위당했을 때의 이야기예요. 밤이 되자 사방에서 초나라의 노래가 들려오니, 항우는 초나라 땅이 이미 유방의 손에 넘어간 줄 알고 크게 놀랐답니다. 사실 이 노래는 유방이 초나라 병사들의 사기를 꺾으려고 일부러 부르게 한 것이었지요. 이 이야기는 사기(史記) 항우본기(項羽本紀)에 전해지며, 사방이 모두 적으로 둘러싸인 위태로운 상황을 가리키게 되었어요.","examples":["숙제도 밀리고 시험도 코앞이라 사면초가에 빠진 기분이었다.","팀 전체가 실수를 저질러 경기에서 사면초가에 몰렸다.","약속을 여러 개 겹쳐 잡아서 사면초가가 되어 버렸다."]},{"hanja":"十中八九","hangul":"십중팔구","chars":[["十","열 십"],["中","가운데 중"],["八","여덟 팔"],["九","아홉 구"]],"meaning":"거의 대부분","origin":"특별한 역사적 고사에서 나온 말이라기보다, 열 가운데 여덟이나 아홉이라는 뜻 그대로 옛날부터 자연스럽게 쓰여 온 표현이에요. 어떤 일이 일어날 가능성이 매우 높다는 것을 숫자로 간단하고 분명하게 나타낸 말이랍니다. 지금도 우리가 일상에서 '거의 확실하다'는 뜻으로 자주 사용하는 친숙한 표현이에요.","examples":["그렇게 늦게 자면 십중팔구 아침에 못 일어난다.","이 문제는 십중팔구 시험에 나올 테니 꼭 외워 두자.","준비 없이 발표하면 십중팔구 실수하기 마련이다."]},{"hanja":"錦上添花","hangul":"금상첨화","chars":[["錦","비단 금"],["上","위 상"],["添","더할 첨"],["花","꽃 화"]],"meaning":"좋은 일에 또 좋은 일이 더해짐","origin":"중국 송나라의 문장가 왕안석(王安石)이 지은 시 '즉사(卽事)'에 나오는 구절에서 비롯된 말이에요. 왕안석은 개혁 정치가 실패한 뒤 관직에서 물러나 남경에 머물며 벗들과 술을 즐기다가 흥에 겨워 '좋은 모임에 술잔을 비우려는데, 아름다운 노래가 비단 위에 꽃을 더하는구나'라는 시를 지었답니다. 비단만 해도 이미 아름다운데 그 위에 꽃까지 수놓으면 더욱 아름답다는 뜻에서, 좋은 일에 또 좋은 일이 겹치는 것을 가리키는 말이 되었어요.","examples":["시험도 잘 봤는데 상까지 받았으니 금상첨화다.","맛있는 음식에 좋은 날씨까지 더해지니 금상첨화였다.","여행지가 아름다운 데다 날씨도 좋으니 금상첨화가 따로 없다."]},{"hanja":"雪上加霜","hangul":"설상가상","chars":[["雪","눈 설"],["上","위 상"],["加","더할 가"],["霜","서리 상"]],"meaning":"어려운 일이 겹쳐 일어남","origin":"정확히 누구의 이야기에서 처음 시작되었는지는 문헌마다 조금씩 다르게 전해져요. 중국 송나라 때의 불교 책 경덕전등록(景德傳燈錄) 등 여러 문헌에서 이 표현이 쓰인 것으로 알려져 있답니다. 눈이 쌓인 위에 다시 서리까지 내리면 더욱 춥고 힘들어지는 모습에 빗대어, 어려운 일이 겹쳐서 일어나는 상황을 가리키는 말로 자리 잡았어요.","examples":["비를 맞아 감기에 걸렸는데 우산까지 잃어버려서 설상가상이었다.","지각한 데다 준비물까지 놓고 왔으니 설상가상이다.","넘어져서 다쳤는데 가방까지 찢어졌으니 설상가상이 아닐 수 없다."]},{"hanja":"他山之石","hangul":"타산지석","chars":[["他","다를 타"],["山","뫼 산"],["之","갈 지"],["石","돌 석"]],"meaning":"남의 하찮은 언행도 자신을 수양하는 데 도움이 됨","origin":"중국에서 가장 오래된 시집인 시경(詩經) 소아(小雅) 학명(鶴鳴)편에 나오는 '다른 산의 못생긴 돌이라도 이 산의 옥을 가는 데 쓸 수 있다'는 구절에서 나온 말이에요. 보잘것없어 보이는 다른 산의 돌도 옥을 다듬는 숫돌로 쓰일 수 있다는 뜻을 담고 있답니다. 이처럼 남의 하찮아 보이는 말이나 행동도 자신을 갈고닦는 데 도움이 될 수 있다는 뜻으로 쓰이게 되었어요.","examples":["친구의 실수를 타산지석으로 삼아 나는 같은 잘못을 하지 않으려 했다.","다른 반의 문제를 타산지석으로 삼아 우리 반은 미리 대비했다.","선배의 실패담을 타산지석 삼아 계획을 더 꼼꼼히 세웠다."]},{"hanja":"近墨者黑","hangul":"근묵자흑","chars":[["近","가까울 근"],["墨","먹 묵"],["者","사람 자"],["黑","검을 흑"]],"meaning":"나쁜 사람과 가까이하면 물들기 쉬움","origin":"중국 진(晉)나라의 학자 부현(傅玄)이 지은 '태자소부잠(太子少傅箴)'이라는 글에 나오는 '붉은 것을 가까이하면 붉어지고, 먹을 가까이하면 검어진다'는 구절에서 비롯되었어요. 먹을 가까이 두고 다루다 보면 자기도 모르게 검은 먹물이 묻게 된다는 뜻이랍니다. 이처럼 나쁜 사람이나 나쁜 환경을 가까이하면 자신도 모르게 그 나쁜 습성에 물들기 쉽다는 교훈을 담고 있어요.","examples":["근묵자흑이라고, 나쁜 습관을 가진 친구와 어울리다 보니 나도 모르게 물들었다.","부모님은 근묵자흑을 걱정하며 좋은 친구를 사귀라고 말씀하셨다.","열심히 공부하는 친구들과 어울리니 근묵자흑처럼 나도 열심히 하게 되었다."]},{"hanja":"大器晩成","hangul":"대기만성","chars":[["大","큰 대"],["器","그릇 기"],["晩","늦을 만"],["成","이룰 성"]],"meaning":"큰 인물은 늦게 이루어짐","origin":"본래 중국 고전 노자(老子) 도덕경(道德經)에 나오는 '큰 그릇은 늦게 이루어진다'는 말에서 비롯되었어요. 이 말은 삼국시대 위나라의 최림(崔林)이라는 인물의 실제 이야기와 함께 유명해졌는데, 최림은 젊었을 때 별다른 재주를 보이지 못해 친척들에게 무시당했답니다. 그러나 사촌 형 최염(崔琰)만은 '큰 그릇은 늦게 이루어지는 법이니, 언젠가 반드시 큰 인물이 될 것'이라며 그를 믿어 주었고, 훗날 최림은 정말로 높은 벼슬에까지 올랐어요. 이 이야기에서 크게 될 사람은 늦게 성공한다는 뜻의 '대기만성'이 널리 쓰이게 되었답니다.","examples":["처음엔 실력이 부족했지만 대기만성이라고, 나중엔 훌륭한 선수가 되었다.","늦게 시작했어도 꾸준히 노력해 대기만성형 인재가 되었다.","부모님은 늦되는 아이라도 대기만성일 수 있다며 응원해 주셨다."]},{"hanja":"日就月將","hangul":"일취월장","chars":[["日","날 일"],["就","나아갈 취"],["月","달 월"],["將","나아갈 장"]],"meaning":"나날이 다달이 자라거나 발전함","origin":"중국의 옛 시집 시경(詩經) 주송(周頌) 경지(敬之)편에 나오는 '날로 나아가고 달로 나아가, 배움이 계속 이어져 밝은 데에 이른다'는 구절에서 나온 말이에요. 하루하루, 한 달 한 달 꾸준히 배우고 노력하면 점점 더 나아진다는 뜻을 담은 표현이랍니다. 그래서 날마다 달마다 실력이 눈에 띄게 자라나거나 발전하는 모습을 가리킬 때 쓰여요.","examples":["매일 연습하더니 그의 실력이 일취월장했다.","꾸준히 책을 읽은 덕분에 글쓰기 실력이 일취월장했다.","열심히 훈련한 결과 달리기 기록이 일취월장으로 좋아졌다."]},{"hanja":"殺身成仁","hangul":"살신성인","chars":[["殺","죽일 살"],["身","몸 신"],["成","이룰 성"],["仁","어질 인"]],"meaning":"자기 몸을 희생하여 옳은 일을 행함","origin":"공자님의 말씀을 담은 논어(論語) 위령공(衛靈公)편에 나오는 말이에요. 공자는 '뜻있는 선비와 어진 사람은 살기 위해 옳음을 해치지 않으며, 오히려 자기 몸을 바쳐서라도 어짊을 이룬다'고 말씀하셨답니다. 자신의 목숨보다 옳은 도리를 더 소중히 여겨야 한다는 공자의 가르침에서 나온 말이에요.","examples":["소방관은 살신성인의 정신으로 불 속에 뛰어들어 사람을 구했다.","친구를 구하려고 위험을 무릅쓴 그의 행동은 살신성인이라 불릴 만했다.","살신성인의 자세로 봉사하는 사람들 덕분에 세상이 조금 더 따뜻해진다."]},{"hanja":"多多益善","hangul":"다다익선","chars":[["多","많을 다"],["多","많을 다"],["益","더할 익"],["善","좋을 선"]],"meaning":"많으면 많을수록 좋음","origin":"중국 한나라를 세운 유방(劉邦)과 명장 한신(韓信) 사이의 이야기에서 나왔어요. 유방이 한신에게 '그대는 병사를 얼마나 거느릴 수 있는가'라고 묻자 한신은 '많으면 많을수록 좋습니다'라고 대답했답니다. 유방이 '그럼 나는 얼마나 거느릴 수 있는가' 하고 되묻자, 한신은 '폐하는 병사가 아니라 장수들을 거느리는 능력이 뛰어나십니다'라고 재치 있게 답했어요. 이 이야기는 사기(史記) 회음후열전(淮陰侯列傳)에 전해지며, 많으면 많을수록 좋다는 뜻으로 쓰이게 되었답니다.","examples":["용돈은 다다익선이라며 동생이 웃었다.","도움의 손길은 다다익선이니 봉사자를 많이 모집했다.","연습 시간은 다다익선이라 생각해 매일 조금씩 더 연습했다."]},{"hanja":"知彼知己","hangul":"지피지기","chars":[["知","알 지"],["彼","저 피"],["知","알 지"],["己","몸 기"]],"meaning":"상대를 알고 나를 알아야 함","origin":"중국 춘추시대의 병법가 손무(孫武)가 지은 손자병법(孫子兵法) 모공(謀攻)편에 나오는 '상대를 알고 나를 알면 백 번 싸워도 위태롭지 않다'는 구절에서 나온 말이에요. 전쟁에서 이기려면 적의 상황뿐 아니라 자기 자신의 상황도 정확히 알아야 한다는 뜻이랍니다. 지금은 전쟁뿐 아니라 어떤 경쟁이나 문제를 대할 때도 상대와 나를 잘 알아야 한다는 지혜로 널리 쓰이고 있어요.","examples":["시합 전에 상대 팀을 분석하는 것은 지피지기의 전략이다.","지피지기면 백전백승이라고, 상대의 장단점을 먼저 파악했다.","나의 약점을 아는 것도 지피지기의 시작이다."]},{"hanja":"螢雪之功","hangul":"형설지공","chars":[["螢","반딧불 형"],["雪","눈 설"],["之","갈 지"],["功","공 공"]],"meaning":"고생하며 부지런히 공부한 보람","origin":"중국 진나라(晉)에 차윤과 손강이라는 사람이 있었어요. 두 사람 모두 집이 가난해서 등불을 켤 기름을 살 수 없었지요. 차윤은 여름밤 반딧불이를 잡아 주머니에 넣고 그 빛으로 책을 읽었고, 손강은 겨울에 눈(雪)의 흰빛에 비추어 밤새 공부했답니다. 이렇게 어려운 환경에서도 포기하지 않고 노력한 끝에 두 사람 모두 훌륭한 관리가 되었어요. 그래서 '형설지공'은 고생하며 부지런히 공부해서 얻은 보람을 뜻하게 되었답니다.","examples":["밤늦게까지 공부한 형은 결국 형설지공으로 원하는 학교에 합격했다.","어려운 형편에도 포기하지 않고 공부한 끝에 형설지공을 이루었다.","형설지공의 자세로 꾸준히 노력한 끝에 좋은 결과를 얻었다."]},{"hanja":"我田引水","hangul":"아전인수","chars":[["我","나 아"],["田","밭 전"],["引","끌 인"],["水","물 수"]],"meaning":"자기에게만 이롭게 생각하거나 행동함","origin":"중국 고전이 아니라 일본에서 만들어진 한자성어예요. 밭농사가 많은 일본에서는 물을 대는 도랑이 여러 논밭 사이를 지나가는데, 이웃과 협력하지 않고 자기 밭에만 물을 끌어들이는 이기적인 모습에서 이 말이 생겨났답니다. 우리나라에 들어오면서 밭 대신 논에 빗대어 '내 논에 물 대기'라는 뜻으로도 풀이하게 되었어요. 자기에게만 이롭게 생각하거나 행동하는 것을 가리키는 말이 되었답니다.","examples":["규칙을 자기한테 유리하게만 해석하는 건 아전인수격이다.","그는 아전인수로 상황을 자기 편한 대로만 설명했다.","모두에게 공평해야 할 규칙을 아전인수로 바꾸면 안 된다."]},{"hanja":"朝三暮四","hangul":"조삼모사","chars":[["朝","아침 조"],["三","석 삼"],["暮","저물 모"],["四","넉 사"]],"meaning":"눈앞의 차이만 알고 결과는 같은 것을 모름","origin":"중국 고전 열자(列子) 황제(黃帝)편에 나오는 이야기예요. 송나라에 원숭이를 기르던 저공(狙公)이라는 사람이 있었는데, 먹이가 부족해지자 도토리를 아침에 3개, 저녁에 4개 주겠다고 했더니 원숭이들이 화를 냈답니다. 그래서 저공이 아침에 4개, 저녁에 3개를 주겠다고 하자 원숭이들은 오히려 좋아했다고 해요. 하루에 받는 도토리는 7개로 똑같은데도, 당장 눈앞의 차이만 보고 결과가 같은 줄은 모르는 어리석음을 뜻하게 되었어요.","examples":["용돈을 나눠 주는 방식만 바꿨을 뿐인데 좋아하다니 조삼모사나 다름없다.","포장만 바뀐 같은 과자에 속는 건 조삼모사와 비슷하다.","이름만 바뀐 같은 숙제에 좋아했으니 조삼모사인 셈이었다."]},{"hanja":"五里霧中","hangul":"오리무중","chars":[["五","다섯 오"],["里","마을 리"],["霧","안개 무"],["中","가운데 중"]],"meaning":"무슨 일에 대해 알 길이 없음","origin":"중국 후한서(後漢書) 장해전(張楷傳)에 나오는 이야기예요. 장해는 학문이 뛰어나 따르는 제자가 100여 명이나 되었지만, 세상과 어울리기를 싫어해 시골에 숨어 살았답니다. 그는 도술에도 능해서 5리(약 2킬로미터) 안을 온통 짙은 안개로 뒤덮을 수 있었는데, 만나고 싶지 않은 사람이 찾아오면 안개를 일으켜 길을 찾지 못하게 했다고 해요. 이 이야기에서 안개 속에서 길을 잃은 것처럼 무슨 일인지 도무지 알 수 없는 상황을 '오리무중'이라 부르게 되었답니다.","examples":["지갑을 어디에 뒀는지 도무지 기억나지 않아 오리무중이었다.","범인의 행방이 오리무중이라 수사가 계속되고 있다.","시험 범위가 어디까지인지 오리무중이라 다들 당황했다."]},{"hanja":"表裏不同","hangul":"표리부동","chars":[["表","겉 표"],["裏","속 리"],["不","아닐 부"],["同","같을 동"]],"meaning":"겉과 속이 다름","origin":"특정한 역사적 사건에서 나온 말이라기보다, 겉과 속이 같아야 한다는 유교의 가르침 속에서 자연스럽게 쓰여 온 표현이에요. 옛 선비들은 겉으로 보이는 말과 행동이 마음속 생각과 같아야 한다고 중요하게 여겼답니다. 그래서 겉으로 드러난 모습과 속마음이 서로 다른 것을 가리켜 '표리부동'이라 부르게 되었어요.","examples":["앞에서는 웃으면서 뒤에서 험담하는 사람은 표리부동한 사람이다.","표리부동한 태도는 결국 친구들의 신뢰를 잃게 만든다.","겉으로는 친절한 척했지만 속마음은 달랐던 그의 표리부동함이 드러났다."]},{"hanja":"進退兩難","hangul":"진퇴양난","chars":[["進","나아갈 진"],["退","물러날 퇴"],["兩","두 량"],["難","어려울 난"]],"meaning":"나아가지도 물러서지도 못하는 어려운 처지","origin":"중국의 옛 시집 시경(詩經) 대아(大雅) 상유(桑柔)편에 나오는 '나아가지도 물러서지도 못해 마치 골짜기에 갇힌 듯하다'는 표현과 뜻이 통하는 말이에요. 이런 표현들이 오랜 세월 쓰이며, 나아갈 수도 물러설 수도 없는 어려운 처지를 가리키는 '진퇴양난'으로 자리 잡게 되었답니다. 앞으로 가도 뒤로 가도 곤란한 상황에 놓였을 때 쓰는 말이에요.","examples":["숙제도 끝내야 하고 약속도 지켜야 해서 진퇴양난에 빠졌다.","양쪽 친구 모두를 도울 수 없어 진퇴양난의 상황이 되었다.","비가 와서 나가지도 못하고 안에 있기도 답답한 진퇴양난이었다."]},{"hanja":"背恩忘德","hangul":"배은망덕","chars":[["背","등질 배"],["恩","은혜 은"],["忘","잊을 망"],["德","덕 덕"]],"meaning":"은혜를 저버리고 배신함","origin":"특정한 고사에서 유래했다기보다, 은혜를 저버리는 것을 경계하는 옛사람들의 가르침 속에서 만들어진 말이에요. 유교에서는 은혜를 입으면 그것을 잊지 않고 갚는 것을 중요한 도리로 여겼답니다. 그래서 받은 은혜와 덕을 저버리고 오히려 배신하는 태도를 가리켜 '배은망덕'이라 부르게 되었어요.","examples":["도와준 친구를 오히려 험담하다니 배은망덕한 행동이다.","부모님의 은혜를 잊고 함부로 대하는 것은 배은망덕한 일이다.","그렇게 도와줬는데 모른 척하다니 배은망덕도 유분수다."]},{"hanja":"勸善懲惡","hangul":"권선징악","chars":[["勸","권할 권"],["善","착할 선"],["懲","징계할 징"],["惡","악할 악"]],"meaning":"선을 권장하고 악을 벌함","origin":"중국의 역사책 춘추좌씨전(春秋左氏傳) 성공(成公) 14년 기록에 나오는 '악을 징계하고 선을 권한다'는 말에서 비롯되었어요. 이 책은 공자가 지은 역사서 춘추(春秋)를 자세히 풀이한 책으로, 옳고 그름을 분명히 가려 기록해야 한다는 정신을 담고 있답니다. 이런 정신에서 착한 일은 북돋아 주고 나쁜 일은 벌한다는 뜻의 '권선징악'이 나오게 되었어요.","examples":["옛이야기는 대부분 권선징악의 교훈을 담고 있다.","동화 속 나쁜 인물이 벌을 받는 결말은 권선징악을 보여 준다.","착한 주인공이 복을 받는 이야기는 권선징악의 대표적인 예다."]},{"hanja":"附和雷同","hangul":"부화뇌동","chars":[["附","붙을 부"],["和","화할 화"],["雷","우레 뢰"],["同","같을 동"]],"meaning":"줏대 없이 남의 의견에 따름","origin":"중국의 고전 예기(禮記) 곡례(曲禮)편에 나오는 말이에요. 천둥이 치면 세상 모든 것이 그 소리에 따라 함께 울리는 것처럼, 자기 생각 없이 남의 의견에 무조건 따르는 것을 빗대어 표현했답니다. 공자도 '군자는 화합하되 무턱대고 따르지 않고, 소인은 무턱대고 따르되 화합하지 못한다'고 말한 적이 있어요. 이처럼 줏대 없이 남의 의견을 그대로 따르는 모습을 가리켜 '부화뇌동'이라 부르게 되었답니다.","examples":["친구들이 하자는 대로 부화뇌동해서 결국 다 같이 혼났다.","유행이라고 무조건 따라가는 것도 부화뇌동일 수 있다.","자기 생각 없이 남의 말에 부화뇌동하지 말고 스스로 판단해야 한다."]},{"hanja":"九死一生","hangul":"구사일생","chars":[["九","아홉 구"],["死","죽을 사"],["一","한 일"],["生","날 생"]],"meaning":"여러 번 죽을 고비를 넘기고 살아남","origin":"중국 초나라의 충신이자 시인인 굴원(屈原)이 지은 초사(楚辭) 이소(離騷)에 나오는 '아홉 번 죽더라도 결코 후회하지 않으리라'는 구절에서 비롯되었어요. 굴원은 임금에게 옳은 말을 하다가 모함을 받아 쫓겨났지만, 나라를 향한 자신의 진심은 아무리 어려운 일을 겪어도 후회하지 않는다는 굳은 뜻을 노래했답니다. 이 구절에서 아홉 번 죽을 뻔한 고비를 넘기고 겨우 살아난다는 뜻의 '구사일생'이 나오게 되었어요.","examples":["산에서 길을 잃었다가 구조대 덕분에 구사일생으로 살아났다.","교통사고에서 구사일생으로 목숨을 건졌다는 소식을 들었다.","폭풍우 속에서 구사일생으로 항구에 도착한 배가 있었다."]},{"hanja":"漁夫之利","hangul":"어부지리","chars":[["漁","고기잡을 어"],["夫","사내 부"],["之","갈 지"],["利","이로울 리"]],"meaning":"둘이 다투는 사이에 제삼자가 이익을 봄","origin":"중국 전국시대의 책 전국책(戰國策) 연책(燕策)에 나오는 이야기예요. 조나라가 연나라를 공격하려 하자, 소진(蘇秦)의 동생인 유세가 소대(蘇代)가 조나라 혜문왕을 찾아가 이야기를 들려주었답니다. 조개가 입을 벌리고 햇볕을 쬐는데 도요새가 조개를 쪼아 먹으려다 서로 물고 물리며 다투는 사이, 지나가던 어부가 둘 다 잡아가 버렸다는 이야기였지요. 조나라와 연나라가 서로 싸우다 지치면 강한 진나라가 그 어부처럼 이득을 챙길 것이라는 말에 혜문왕은 공격을 그만두었고, 이 이야기에서 둘이 다투는 사이 제삼자가 이익을 보는 것을 뜻하는 '어부지리'가 나왔어요.","examples":["두 친구가 다투는 사이 다른 친구가 어부지리로 1등을 차지했다.","두 팀이 서로 싸우다 지쳐서 결국 다른 팀이 어부지리로 우승했다.","형제가 장난감을 두고 다투는 사이 동생이 어부지리로 가지고 놀았다."]},{"hanja":"同床異夢","hangul":"동상이몽","chars":[["同","같을 동"],["床","평상 상"],["異","다를 이"],["夢","꿈 몽"]],"meaning":"겉으론 함께하나 속으론 다른 생각을 함","origin":"중국 남송 시대의 학자 진량(陳亮)이 남긴 글에서 비롯된 말이에요. 당시 여러 나라가 겉으로는 동맹을 맺으면서도 속으로는 서로 다른 속셈을 품고 배신하는 일이 잦았답니다. 진량은 이런 모습을 두고 같은 침상에서 자면서도 서로 다른 꿈을 꾸는 것과 같다고 비판했다고 해요. 이 말에서 겉으로는 함께하는 것처럼 보여도 속으로는 저마다 다른 생각을 하는 것을 뜻하는 '동상이몽'이 나왔어요.","examples":["같은 조가 되었지만 동상이몽으로 서로 다른 계획을 세우고 있었다.","부부는 여행을 함께 가기로 했지만 동상이몽으로 원하는 곳이 달랐다.","함께 프로젝트를 하면서도 동상이몽으로 방향이 자꾸 어긋났다."]},{"hanja":"優柔不斷","hangul":"우유부단","chars":[["優","넉넉할 우"],["柔","부드러울 유"],["不","아닐 부"],["斷","끊을 단"]],"meaning":"결단력이 없이 망설임","origin":"특정한 고사에서 나온 말이라기보다, 오래전부터 어떤 일을 대할 때 지나치게 부드럽고 망설이기만 해서 결단을 내리지 못하는 성격이나 태도를 가리키는 말로 자연스럽게 쓰여 왔어요. 넉넉할 우(優)와 부드러울 유(柔)라는 한자에서도 알 수 있듯이, 너무 무르고 부드러워서 딱 잘라 결정을 내리지 못하는 모습을 표현한답니다. 중요한 순간에 우물쭈물하다가 좋은 기회를 놓치는 것을 경계하는 뜻을 담고 있어요.","examples":["메뉴 하나 고르는 데도 한참 망설이는 우유부단한 성격이다.","우유부단하게 굴다가 결국 좋은 기회를 놓치고 말았다.","결정을 못 내리고 우유부단하게 있으면 시간만 흘러간다."]},{"hanja":"自强不息","hangul":"자강불식","chars":[["自","스스로 자"],["强","굳셀 강"],["不","아닐 불"],["息","쉴 식"]],"meaning":"스스로 힘써 쉬지 않음","origin":"중국 고전 주역(周易)의 건괘(乾卦) 상전(象傳)에 나오는 '하늘의 운행이 굳세니, 군자는 이를 본받아 스스로 힘쓰며 쉬지 않는다'라는 말에 나오는 표현이에요. 하늘이 잠시도 멈추지 않고 움직이듯이, 사람도 스스로 노력하기를 게을리하지 않아야 한다는 뜻을 담고 있어요.","examples":["그는 자강불식의 자세로 매일 아침 운동을 거르지 않는다.","자강불식하는 마음으로 꾸준히 실력을 갈고닦았다.","힘들어도 포기하지 않고 자강불식하는 태도가 그를 성장시켰다."]},{"hanja":"言行一致","hangul":"언행일치","chars":[["言","말씀 언"],["行","행할 행"],["一","한 일"],["致","이를 치"]],"meaning":"말과 행동이 같음","origin":"특정한 고사에서 나온 말이라기보다, 말과 행동이 같아야 한다는 유교의 오랜 가르침에서 자연스럽게 자리 잡은 표현이에요. 공자를 비롯한 옛 선비들은 말만 앞세우고 실천하지 않는 것을 가장 부끄러운 일로 여겼답니다. 그래서 자신이 한 말을 그대로 실천하는 것을 가리켜 '언행일치'라고 부르게 되었어요.","examples":["약속을 꼭 지키는 그는 언행일치를 실천하는 사람이다.","말만 하고 행동하지 않으면 언행일치라 할 수 없다.","선생님은 항상 언행일치를 강조하시며 스스로도 모범을 보이셨다."]},{"hanja":"初志一貫","hangul":"초지일관","chars":[["初","처음 초"],["志","뜻 지"],["一","한 일"],["貫","꿸 관"]],"meaning":"처음 세운 뜻을 끝까지 밀고 나감","origin":"특정한 역사적 인물의 고사에서 나온 말이라기보다, 처음의 뜻을 끝까지 밀고 나가는 것을 중요하게 여기는 마음가짐에서 자연스럽게 만들어진 표현이에요. 마치 하나의 실이 처음부터 끝까지 구슬을 꿰뚫듯이, 처음에 세운 뜻이 흔들림 없이 끝까지 이어져야 한다는 뜻을 담고 있답니다. 어떤 일을 하다가 중간에 포기하지 않고 처음 마음 그대로 끝까지 해내는 태도를 가리켜요.","examples":["힘든 순간에도 초지일관 꿈을 향해 나아갔다.","그는 초지일관의 자세로 목표를 끝까지 포기하지 않았다.","처음 다짐한 대로 초지일관 연습을 이어 간 끝에 좋은 결과를 얻었다."]},{"hanja":"切磋琢磨","hangul":"절차탁마","chars":[["切","끊을 절"],["磋","갈 차"],["琢","다듬을 탁"],["磨","갈 마"]],"meaning":"부지런히 학문과 덕행을 갈고 닦음","origin":"중국에서 가장 오래된 시집인 시경(詩經) 위풍(衛風) 기욱(淇奧)편에 나오는 '자르는 듯, 가는 듯, 쪼는 듯, 닦는 듯하다'라는 구절에 나오는 말이에요. 이는 뼈나 뿔, 옥돌 같은 것을 자르고 갈고 쪼고 닦아서 훌륭한 도구나 보석으로 만드는 과정을 표현한 것이랍니다. 이처럼 학문과 인격도 여러 번 갈고닦아야 훌륭해진다는 뜻을 담고 있어요.","examples":["매일 조금씩 절차탁마하듯 실력을 다듬어 나갔다.","절차탁마의 자세로 글쓰기 실력을 꾸준히 키워 갔다.","스승은 제자에게 절차탁마하는 마음으로 배움에 임하라고 하셨다."]},{"hanja":"溫柔敦厚","hangul":"온유돈후","chars":[["溫","따뜻할 온"],["柔","부드러울 유"],["敦","도타울 돈"],["厚","두터울 후"]],"meaning":"성격이 부드럽고 인정이 두터움","origin":"중국 고전 예기(禮記) 경해(經解)편에 나오는 '온유돈후는 시의 가르침이다'라는 말에서 나온 표현이에요. 시경(詩經)을 배우면 사람의 성품이 따뜻하고 부드러우며 인정이 두터워진다는 뜻을 담고 있답니다. 이 말이 널리 쓰이면서, 성격이 부드럽고 정이 많은 사람을 가리키는 표현으로 자리 잡게 되었어요.","examples":["할머니는 언제나 온유돈후한 마음으로 손주들을 대해 주신다.","온유돈후한 성격의 선생님 덕분에 반 분위기가 늘 따뜻했다.","그는 온유돈후해서 친구들 사이에서 인기가 많다."]},{"hanja":"和而不同","hangul":"화이부동","chars":[["和","화할 화"],["而","말이을 이"],["不","아닐 부"],["同","같을 동"]],"meaning":"남과 화목하게 지내지만 무턱대고 어울리지 않음","origin":"공자님의 말씀을 담은 논어(論語) 자로(子路)편에 나오는 '군자는 화목하게 지내지만 무턱대고 어울리지 않고, 소인은 무턱대고 어울리지만 화목하게 지내지 못한다'라는 말에서 나온 표현이에요. 진정한 어울림은 서로 다름을 인정하면서도 조화를 이루는 것이지, 무조건 같은 생각을 강요하는 것이 아니라는 공자의 가르침을 담고 있답니다.","examples":["친구들과 화이부동의 자세로 지내되 나쁜 일에는 휩쓸리지 않았다.","화이부동하는 태도로 다양한 의견을 존중하면서도 옳지 않은 일은 따르지 않았다.","반 친구들과 화목하게 지내면서도 화이부동의 마음으로 자기 생각을 지켰다."]},{"hanja":"心機一轉","hangul":"심기일전","chars":[["心","마음 심"],["機","틀 기"],["一","한 일"],["轉","구를 전"]],"meaning":"어떤 계기로 마음가짐을 완전히 바꿈","origin":"특정한 옛 고사에서 유래한 말이라기보다, 마음의 작용을 뜻하는 '심기(心機)'와 방향을 완전히 바꾼다는 뜻의 '일전(一轉)'이 합쳐져 만들어진 표현이에요. 실패나 어려운 일을 겪은 뒤 지금까지의 마음가짐을 확 바꾸어 새롭게 다시 시작한다는 뜻을 담고 있답니다. 지금도 시험에 떨어지거나 힘든 일이 있은 뒤 새로운 각오로 다시 도전할 때 자주 쓰이는 말이에요.","examples":["시험에서 떨어진 뒤 심기일전하여 다시 도전했다.","심기일전의 각오로 새 학기를 맞이했다.","실패를 딛고 심기일전해서 다음 대회를 준비했다."]}];

let weekOffset = 0; // 0 = 이번 주, +1 = 다음 주, -1 = 지난 주 ...

function rgb(a) { return `rgb(${a[0]},${a[1]},${a[2]})`; }
function lighten(a, factor=0.85) {
  return `rgb(${Math.round(a[0]+(255-a[0])*factor)},${Math.round(a[1]+(255-a[1])*factor)},${Math.round(a[2]+(255-a[2])*factor)})`;
}

// ISO 8601 주차 계산 (Python의 date.isocalendar()[1]과 동일한 결과)
function isoWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = (d.getUTCDay() + 6) % 7; // 월요일=0
  d.setUTCDate(d.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  const firstDayNum = (firstThursday.getUTCDay() + 6) % 7;
  firstThursday.setUTCDate(firstThursday.getUTCDate() - firstDayNum + 3);
  return 1 + Math.round((d - firstThursday) / (7 * 24 * 60 * 60 * 1000));
}

function pad(n) { return String(n).padStart(2, "0"); }

function render() {
  const today = new Date();
  today.setDate(today.getDate() + weekOffset * 7);
  const weekNo = isoWeek(today);
  const idiom = IDIOMS[((weekNo % IDIOMS.length) + IDIOMS.length) % IDIOMS.length];
  const dateStr = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;

  document.getElementById("info").textContent =
    `${idiom.hanja} (${idiom.hangul}) · 제${weekNo}주`;

  document.getElementById("headerText").textContent =
    `이번 주의 사자성어  ·  ${dateStr}  (제${weekNo}주)`;

  const hanjaRow = document.getElementById("hanjaRow");
  hanjaRow.innerHTML = "";
  [...idiom.hanja].forEach((ch, i) => {
    const span = document.createElement("span");
    span.textContent = ch;
    span.style.color = rgb(CHAR_COLORS[i % CHAR_COLORS.length]);
    hanjaRow.appendChild(span);
  });

  document.getElementById("hangulReading").textContent = idiom.hangul;

  const charsRow = document.getElementById("charsRow");
  charsRow.innerHTML = "";
  idiom.chars.forEach((pair, i) => {
    const color = CHAR_COLORS[i % CHAR_COLORS.length];
    const box = document.createElement("div");
    box.className = "char-box";
    box.textContent = `${pair[0]} ${pair[1]}`;
    box.style.color = rgb(color);
    box.style.borderColor = rgb(color);
    box.style.background = lighten(color, 0.85);
    charsRow.appendChild(box);
  });

  document.getElementById("meaningText").textContent = idiom.meaning;
  document.getElementById("originBox").textContent = idiom.origin;

  const exampleList = document.getElementById("exampleList");
  exampleList.innerHTML = "";
  (idiom.examples || []).forEach(sentence => {
    const li = document.createElement("li");
    li.textContent = sentence;
    exampleList.appendChild(li);
  });

  const grid = document.getElementById("practiceGrid");
  grid.innerHTML = "";
  idiom.chars.forEach((pair, i) => {
    const color = CHAR_COLORS[i % CHAR_COLORS.length];
    const row = document.createElement("div");
    row.className = "practice-row";

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = `${pair[0]} ${pair[1]}`;
    label.style.color = rgb(color);
    label.style.borderColor = rgb(color);
    label.style.background = lighten(color, 0.88);
    row.appendChild(label);

    for (let b = 0; b < 4; b++) {
      const box = document.createElement("div");
      box.className = "box";
      if (b === 0) box.textContent = pair[0];
      row.appendChild(box);
    }
    grid.appendChild(row);
  });
}

document.getElementById("prevBtn").addEventListener("click", () => {
  weekOffset -= 1;
  render();
});
document.getElementById("nextBtn").addEventListener("click", () => {
  weekOffset += 1;
  render();
});

render();
</script>
</body>
</html>
